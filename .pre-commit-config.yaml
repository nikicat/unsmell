repos:
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        exclude: ^evals/rounds/  # stored skill output, kept byte for byte
        args: [--wrap=80, --number, --compact-tables]
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-frontmatter==2.2.0
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.414
    hooks:
      - id: pyright
        exclude: ^evals/fixtures/
        additional_dependencies:
          - pydantic==2.14.2
          - pyyaml==6.0.3
          - types-PyYAML==6.0.12.20261030
