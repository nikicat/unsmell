    "not filled yet" and its comment explains what 0 means. The iter closure at history.rs:404 re-reads
    the same Option with is_none() to overwrite the placeholder. The build_fetcher prefetch loop at history.rs:603
    repeats the predicate as is_some(). The event is half-built until the caller completes it (temporal
    coupling).

    '
  fix: 'One helper next to ensure_block_header_via, `async fn log_timestamp<P: Provider<Ethereum>>(provider:
    &P, store: &LogCache, log: &Log) -> Result<Timestamp, HistoryError>`, which returns `log.block_timestamp`
    when it is Some and otherwise `ensure_block_header_via(provider, store, log.block_number.unwrap_or(0)).await?.timestamp`.
    log_to_evm_event takes `timestamp: Timestamp` as a second parameter and sets it directly (no 0 placeholder,
    comment at 520-521 deleted). The iter closure becomes `let timestamp = log_timestamp(&provider, &store,
    &log).await?; let event = log_to_evm_event(&log, timestamp);` (no `mut`, no inline if). The prefetch
    loop becomes `for log in &logs { let _ = log_timestamp(&provider, &store, log).await; }`. Behaviour:
    a log with no block_number would now warm block 0''s header instead of being skipped; eth_getLogs
    over a closed block range never returns such a log, but the report should name it. If that is unwanted,
    the loop keeps `.filter(|log| log.block_number.is_some())` before the call.

    '
  decision: FIX
