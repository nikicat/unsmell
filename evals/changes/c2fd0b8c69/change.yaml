  claim: The bridge now claims the backend name even when the front bus never gets a SystemPrompter owner,
    for example in a non-GNOME session or while gnome-shell is still down. In that case every BeginPrompting
    fails with the front bus's error (a ServiceUnknown-style error) after exportCallback has already exported
    a callback proxy that nothing unexports (:133, then :137). Before this change, the bridge stayed inactive
    in that case and the fallback kept the name. No doc states this outcome, and the newPrompterBridge
    doc assumes gnome-shell is up "by which point".
  fix: At minimum, the BeginPrompting doc or the type doc says that prompts fail when no front prompter
    owns the name, and BeginPrompting unexports the callback when forwarding fails. Whether the bridge
    should hand the name back, or never claim it outside GNOME, is a design question for the user.
  decision: ASK
  score: 6
  reason: This is a plausible behaviour regression that the change introduced, and fixing it needs a design
    decision. The callback leak on forward failure is older code, but this change now makes it reachable
    at startup.
