[project]
name = "dengi"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pyjwt[crypto]>=2.15.1",
    "requests>=2.34.2",
]

[project.scripts]
seb = "seb:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["seb.py", "schema.sql"]
