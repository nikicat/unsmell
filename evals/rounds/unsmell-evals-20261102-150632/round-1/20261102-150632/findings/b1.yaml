  - id: b1-8
    at:
      - evals/run.py:60-67
    reach:
      - evals/run.py:57-68
      - evals/test_run.py:9-25
    row: inline generic machinery
    claim: >-
      Delta.between parses `git diff -U0` by hand. The path is line[6:] of the
      +++ line, so every deleted file becomes "ev/null". A file that one round
      deletes and a later round restores is therefore not counted as a
      reversal. An added line whose text starts with "++", or a removed line
      starting with "--" (a SQL or Lua comment), is taken for a file header:
      the line is dropped, and a "+++" line also resets the path. A user's
      diff.noprefix setting shifts every path.
    fix: >-
      Parse the diff with unidiff.PatchSet (run.py gets the uv script header
      that changes.py has), taking the source path for removed lines and the
      target path for added lines. Or, without the dependency, run git diff
      with --no-prefix and track headers by state, so that only lines before a
      file's first @@ count as headers. test_run.py gains a case that deletes a
      file and restores it, and one with a removed "-- " line.
    decision: ASK
    score: 9
    reason: a bug in the reversal measure; the fix is either a new dependency or a hand-written parser, so the user picks
    same: [b1-9]
