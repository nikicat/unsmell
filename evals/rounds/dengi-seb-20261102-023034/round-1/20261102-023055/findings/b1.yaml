    decision: FIX
    score: 6
    reason: >-
      A setting read away from the edge, plus an import-time file read. The fix
      merges with b1-1's constructor, so it shares that task.
    same: [b1-1]
  - id: b1-3
    at: [seb.py:66-76, seb.py:96]
    reach: [seb.py:52-76, seb.py:96]
    row: misplaced rule
    claim: >-
      The session is a blind dict read by key at three sites
      (s["access"]["valid_until"] at seb.py:74, ["accounts"] at seb.py:96, and the
      raw write at seb.py:67). The expiry check, a rule about the session, lives
      in load_session, a free function that only reads the session.
    fix: >-
      A dataclass Session with the fields valid_until (datetime), accounts
      (list[Account]) and raw (the JSON as received). Session.from_json(d) parses
      the body. Session.expired is a property. Session.load(path) returns
      Session or None, and session.save(path) writes raw unchanged, so the file
      format stays the same. EnableBanking.session() (b1-1) returns a session
      that is still valid, loaded or authorized, and main iterates over
      session.accounts.
    decision: FIX
    score: 7
    reason: >-
      Expiry check on the wrong owner (named in the placement pass), plus key
      access on a file and API body. The serialized format is unchanged.
    same: [b1-4]
