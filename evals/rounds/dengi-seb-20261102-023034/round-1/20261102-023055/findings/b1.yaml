  - id: b1-14
    at: [schema.sql:1, seb.py:95]
    reach: [schema.sql:1-25, seb.py:95]
    row: temporal coupling
    claim: >-
      The schema is applied with CREATE TABLE IF NOT EXISTS on every run, and it
      has no version (PRAGMA user_version). Any later edit to schema.sql, such as a
      generated column, never reaches an existing dengi.db, and nothing reports
      the mismatch.
    fix: >-
      Store.open checks PRAGMA user_version against a SCHEMA_VERSION in
      schema.sql. It applies migrations in order or recreates the generated
      columns, because they derive from raw, and exits when the database is
      newer.
    decision: PLAN
    score: 5
    reason: >-
      This is a latent problem, not a bug today. It needs a design decision on
      migration versus rebuild from raw.
    same: [b1-12]
