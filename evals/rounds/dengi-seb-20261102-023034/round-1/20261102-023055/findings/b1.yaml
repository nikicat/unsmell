  - id: b1-10
    at: [seb.py:2-6]
    reach: [seb.py:2-6]
    row: compressed doc
    claim: >-
      In the module doc, a semicolon joins two ideas at line 5. The doc leaves out
      the outcome a user meets first: when no valid session is stored, the run
      asks for a Smart-ID login and needs the pasted redirect URL. It also says
      nothing about exiting on a bad redirect.
    fix: >-
      """Fetches the SEB LT account history through Enable Banking.

      Usage: uv run seb [date_from YYYY-MM-DD]

      Upserts the booked transactions into dengi.db. Without date_from, each
      account resumes from its last stored booking day. When no valid session
      is stored, it asks you to log in with Smart-ID and to paste the URL you
      land on. It exits when that URL does not belong to this login."""
    decision: FIX
    score: 5
    reason: A missing user-visible effect and exit, plus a compressed-doc tell.
    same: []
  - id: b1-11
    at: [.gitignore:1-3]
    reach: [.gitignore:1-3]
    row: speculative generality
    claim: >-
      .gitignore ignores only build artefacts. The program reads and writes three
      files in the working directory, and none of them is ignored. They are the
      RSA private key private.pem (seb.py:21), the bank session session.json
      (seb.py:23), and the personal ledger dengi.db (seb.py:94). One git add of
      the directory would commit a private key and bank data.
    fix: >-
      .gitignore also lists /private.pem, /session.json, /dengi.db and
      /dengi.db-journal.
    decision: FIX
    score: 8
    reason: >-
      It prevents leaking a private key and financial data. It is mechanical and
      does not change program behaviour. The row is the nearest one; the defect
      is a missing safety rule.
