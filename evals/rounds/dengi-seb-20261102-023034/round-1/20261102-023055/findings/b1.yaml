  - id: b1-5
    at: [seb.py:97, schema.sql:2]
    reach: [seb.py:97, schema.sql:2, schema.sql:22, schema.sql:25]
    row: misleading name
    claim: >-
      The txn.iban column holds the Enable Banking account uid when the account
      has no IBAN, so the name says less than the column holds. This is PLAUSIBLE
      and needs checking against the Enable Banking docs. As far as I recall, uid
      is scoped to one session, and the stable cross-session identifier is
      identification_hash. If so, the rows of an IBAN-less account split under a
      new key after each re-authorization (180 days at most), and the resume
      query at seb.py:100 finds nothing for them.
    fix: >-
      Account.key (b1-4) falls back to identification_hash instead of uid. The
      column is renamed to account, with a comment saying it holds the IBAN or
      the Enable Banking identification_hash.
    decision: ASK
    score: 8
    reason: >-
      It is a bug if uid is session-scoped, and the rename changes the stored
      schema, which someone outside the changeset can notice.
    same: [b1-4]
  - id: b1-6
    at: [seb.py:99-100, seb.py:4, seb.py:109]
    reach: [seb.py:79-82, seb.py:91-109]
    row: unparsed input
    claim: >-
      sys.argv[1] is a raw str that goes to the API query (seb.py:80) and to the
      output (seb.py:109). It is never checked against the YYYY-MM-DD that the
      module doc promises, and it is re-read inside the per-account loop. The
      fallback from the database is also a raw str, read positionally with
      fetchone()[0]. For an account with no rows, seb.py:109 prints "since None".
    fix: >-
      main parses the argument once, before the loop, with
      date.fromisoformat(sys.argv[1]) when it is given, and exits with a usage
      message otherwise. Store.last_booking_date(key) (b1-7) returns date or
      None. EnableBanking.transactions(uid, since) takes date or None and
      formats it with isoformat(). The summary line reads "since <date>", or
      "full history" when there is no date.
    decision: FIX
    score: 7
    reason: >-
      Unparsed CLI input with the full tell. A bad date now fails locally instead
      of at the API, a check moved to the edge (Behaviour).
    same: [b1-7]
  - id: b1-7
    at: [seb.py:91-109]
    reach: [seb.py:91-109]
    row: mixed altitude
    claim: >-
      main mixes named steps (psu_headers, load_session, transactions) with inline
      details, decisions and effects. The details are the schema bootstrap, a
      count lambda and the upsert SQL. The decisions are the account key, the
      choice of date_from and the BOOK filter. The effects are the upsert and
      the print. The three store statements and the "only booked rows have an
      entry_reference" rule (reason at schema.sql:3) belong to the store, not
      to main.
    fix: >-
      A class Store wraps the sqlite connection. Store.open(path) connects and
      runs schema.sql from beside __file__. It has last_booking_date(key) ->
      date or None, and upsert(key, txs) -> int, which returns the number of new
      rows (it counts before and after inside the method). A named
      booked(txs) filter sits beside the store and carries a short comment
      pointing at schema.sql:3. main reads as steps: config, client, store, then
      for each account fetch, filter, upsert, and print.
    decision: FIX
    score: 6
    reason: >-
      Mixed altitude plus misplaced store rules with the full tell. Minus 2 for
      churn of over 30 lines, but the SQL leaves main as a unit.
    same: [b1-6]
