  - id: b1-1
    at: [seb.py:19-49, seb.py:92-93]
    reach: [seb.py:19-49, seb.py:52-88, seb.py:91-96]
    row: missing receiver
    claim: >-
      headers(), call(), authorize(), load_session() and transactions() all reach
      the same API client context (API, KEY, APP_ID, PSU) through module globals
      instead of a receiver. PSU is a mutable global that main() must fill
      (seb.py:92-93, comment "set in main()" at seb.py:24) before headers() works,
      which is temporal coupling.
    fix: >-
      A class EnableBanking (dataclass) holding app_id, key and the psu headers as
      fields, built once in main as EnableBanking(config, psu_headers()). headers,
      call, authorize, session (today's load_session) and transactions become its
      methods. The PSU global, the global statement and the "set in main()"
      comment are gone.
    decision: FIX
    score: 6
    reason: >-
      Full tell (shared context reaching every sibling, plus the global set by the
      caller). Minus 2 for churn of about 40 lines, but the temporal coupling makes
      it worth more than a plain 5.
    same: [b1-2]
  - id: b1-2
    at: [seb.py:20-23, seb.py:57, seb.py:94]
