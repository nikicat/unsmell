    fix: >
      ResolvedEvent.topic0: Topic; SignatureCache::get/put, resolve_event, resolve_event_topic
      take ChainId and Address; topic_from_signature returns Topic. The adapter's conversions go;
      callers in src/bin/chainfold/evm/events.rs convert once where they get the raw values.
