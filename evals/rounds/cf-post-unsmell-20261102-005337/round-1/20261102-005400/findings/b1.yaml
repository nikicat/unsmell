    row: duplication
    claim: >
      The changeset turned EventSignatureRow into a struct (:17-24) with exactly the fields of
      `signatures::ResolvedEvent` (src/signatures.rs:48-55): signature, topic0, abi_json, each
      with the same meaning and the same None rule for abi_json. Two types now hold one record,
      and the adapter copies it field by field (signature_cache.rs:31-35) and unpacks it
      again for insert (:52-54). The two copies change for the same reason.
    fix: >
      Options. (a) One type: ResolvedEvent (with topic0: Topic, see b1-3) is the record;
      get_event_signature returns Option<ResolvedEvent> and insert takes &ResolvedEvent;
      EventSignatureRow and its re-exports are deleted; the adapter's get/put just map errors.
      evm::cache then depends on crate::signatures (its module doc already links that trait).
      (b) Keep both: `impl From<EventSignatureRow> for ResolvedEvent` next to ResolvedEvent,
      adapter get becomes `opt.map(ResolvedEvent::from)`. I'd pick (a).
    decision: ASK
    score: 6
    reason: two defensible designs; both change public exported types (EventSignatureRow is re-exported from chainfold::evm)
    same: [b1-3, b1-4]
