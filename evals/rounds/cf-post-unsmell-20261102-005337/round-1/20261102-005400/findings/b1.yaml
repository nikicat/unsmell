    row: misplaced rule
    claim: >
      Topic's SQLite encoding as a 32-byte BLOB is written inside EventSignatureCache:
      the write side binds `topic0.as_slice()` (:98), the read side pulls a raw `Vec<u8>`
      into an unnamed tuple (:62-65), checks `topic.len() == 32` and builds
      `Topic::from(B256::from_slice(&topic))` outside the row closure (:69-71). The changeset
      narrowed EventSignatureRow.topic0 to Topic (:21), but its siblings ChainId and
      FilterHash keep their SQLite mapping as `ToSql` impls in src/evm/cache.rs:34-55, and
      Topic has none. A wrong-length BLOB also turns into Ok(None), a silent cache miss.
    fix: >
      `impl ToSql for Topic` and `impl FromSql for Topic` in src/evm/cache.rs next to
      FilterHash's (FromSql: `B256::try_from(blob)` → `FromSqlError::InvalidBlobSize { expected_size: 32, .. }`
      on a wrong length), each with a doc in the style of the ChainId/FilterHash ones.
      insert binds `topic0` directly. get's closure returns
      `EventSignatureRow { signature: row.get(0)?, topic0: row.get(1)?, abi_json: row.get(2)? }`
      and the body is `rows.next().transpose().map_err(Into::into)`; the tuple, the guard and
      the match go. `B256` moves into the tests' imports. arch.md:392/394 lists Topic beside
      ChainId/FilterHash as having its SQLite mapping in the cache layer.
    decision: FIX
    score: 7
    reason: >
      Full tell of a misplaced rule with named siblings (ChainId, FilterHash ToSql) and on
      changed lines (:69-71, :85). Behaviour: a corrupt topic0 BLOB becomes an error instead
      of a silent None; the report names it under Behaviour. Crate-internal (impls on a crate type).
    same: [b1-13]
