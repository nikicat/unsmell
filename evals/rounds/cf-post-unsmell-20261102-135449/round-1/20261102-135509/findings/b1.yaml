    row: unparsed input
    claim: >-
      get_event_signature reads the DB row by position into an unnamed (String, Vec<u8>, Option<String>)
      tuple (:61-65). It checks the topic0 blob length inline in the match guard (:69, literal 32) and builds
      Topic via B256::from_slice. A blob of the wrong length silently becomes Ok(None), so it looks like a
      cache miss. The match over rows.next() is a hand-rolled OptionalExtension::optional on a primary-key
      lookup (PK chain_id, address, event_name at cache.rs:253). The changeset rewrote the assembly arm
      at :69-73.
    fix: >-
      Add impl FromSql and ToSql for Topic in src/evm/cache.rs, beside the ToSql impls for ChainId and FilterHash
      (the FromSql decodes a 32-byte BLOB and errors otherwise). The body then becomes
      stmt.query_row(params, |row| Ok(EventSignatureRow { signature: row.get(0)?, topic0: row.get(1)?,
      abi_json: row.get(2)? })).optional()?. It uses rusqlite::OptionalExtension, as
      src/matcher/anchor_store_sqlite.rs:52 does. The insert binds topic0 directly instead of
      topic0.as_slice() at :98. Behaviour: a malformed topic0 blob now errors instead of reading as a miss.
    decision: FIX
    score: 7
    reason: positional row access, validation after the closure, an inline decision in the assembly, and a misplaced decode rule whose owner by repo convention is cache.rs
