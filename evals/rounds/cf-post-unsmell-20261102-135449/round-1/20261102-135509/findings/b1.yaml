      - src/bin/chainfold/signature_cache.rs:5-8
      - src/bin/chainfold/signature_cache.rs:28-56
    row: duplication
    claim: >-
      The changeset added struct EventSignatureRow (event_signature_cache.rs:17-24) with the same three
      fields as ResolvedEvent (signatures.rs:48-55), differing only in topic0 (Topic vs [u8; 32]). The
      adapter copies one into the other field by field in both directions and round-trips topic0 through
      B256 at signature_cache.rs:33 and :53. The field docs repeat ResolvedEvent's doc.
    fix: >-
      Option A: the cache returns and stores ResolvedEvent directly (evm::cache may depend on the
      standalone signatures module), EventSignatureRow is deleted, and the adapter only maps keys and errors.
      This drops Topic for topic0 in the cache. Option B: keep EventSignatureRow and add
      From<EventSignatureRow> for ResolvedEvent and From<&ResolvedEvent> for EventSignatureRow in the lib,
      next to the row (the bin cannot, by the orphan rule). The adapter then calls .map(Into::into).
      signatures.rs cannot take Topic, because its module doc makes it independent of the rest of chainfold.
      I would pick A, because one record type then serves both layers.
    decision: ASK
    score: 7
    reason: duplicated record type with a hand conversion in both directions; two designs are defensible and both touch the pub API
    same: [b1-2, b1-6]
