    row: duplicated knowledge
    claim: >-
      The fact "a log that carries its own timestamp needs no block header,
      otherwise the header supplies it" is stated in five comments that the
      changeset added. They are the iter comment (:402-403), the log_to_evm_event
      comment (:520-521), the prefetch comment (:601-602), the new test doc
      (:777-780), and the migration comment in cache.rs (:240-245, batch of
      cache.rs). No item owns the rule.
    fix: >-
      The doc of log_timestamp (b2-1) owns the fact. For example, "Returns the
      block timestamp of the given log. Uses the timestamp that the log carries,
      and otherwise reads the block header from the cache or the provider.
      Errors when the header fetch fails." Delete :402-403 and :520-521. Replace
      :601-602 with one line that says why the loop exists ("Warms the header
      cache so that HistBackend::iter can resolve these timestamps without RPC").
      The test doc points to log_timestamp instead of restating the rule (b2-7).
      The migration comment keeps only what the column holds and that it is NULL
      when the provider omitted it or the row predates the column (cache.rs
      batch).
    decision: FIX
    score: 6
    reason: >-
      One fact with five copies, all on changed lines. Removes comments rather
      than adding any.
    same:
      - b2-1
      - b2-5
  - id: b2-5
    at:
      - "src/evm/history.rs:520-521"
      - "src/evm/history.rs:601-602"
    reach:
      - "src/evm/history.rs:520-521"
      - "src/evm/history.rs:601-602"
    row: wrong-layer doc
    claim: >-
      Both new comments describe another function's behaviour. :520-521 says
      "the caller fills it from the (cached) block header", and :601-602 says
      "the query path reads it straight off the persisted log". "Query path"
      names no item (it means HistBackend::iter at :375). "Persisted" is
      imprecise, because LogIndex can serve a page that has not been drained to
      LogCache yet. :520-521 also joins two ideas with a semicolon ("…when
      present; otherwise 0, and…"), which is the compressed style the user
      rejects.
    fix: Both comments go away or shrink as in b2-4. Any pointer that stays names `HistBackend::iter` or `log_timestamp`, not "the query path".
    decision: FIX
    score: 5
    reason: Caller-layer facts and an undefined noun on changed lines. Same edit as b2-4.
    same:
      - b2-4
