    row: algebraic blindness
    claim: >-
      log_to_evm_event returns an EvmEvent whose timestamp is 0 to mean
      "unknown, the caller fills it", and the comment at :520-521 explains what
      the zero means. Zero is also a real timestamp, since the comment at :88-89
      says some chains use timestamp 0 at genesis. At HEAD the caller always
      overwrote the field. The changeset made the overwrite conditional (:404),
      so a half-built event now escapes into a branch.
    fix: >-
      log_to_evm_event takes `timestamp: Timestamp` and never invents one, as in
      b2-1. No EvmEvent exists with an unknown timestamp.
    decision: FIX
    score: 7
    reason: >-
      Catalog tell met in full (a comment explaining what a zero value means, and
      zero is a valid value). Same edit as b2-1.
    same:
      - b2-1
