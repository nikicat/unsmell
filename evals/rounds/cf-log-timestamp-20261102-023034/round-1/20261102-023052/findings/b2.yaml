findings:
  - id: b2-1
    at:
      - "src/evm/history.rs:402-409"
      - "src/evm/history.rs:520-522"
      - "src/evm/history.rs:601-605"
    reach:
      - "src/evm/history.rs:395-416"
      - "src/evm/history.rs:512-531"
      - "src/evm/history.rs:599-609"
    row: duplication
    claim: >-
      The changeset writes one rule three times. A log's timestamp is its own
      block_timestamp when present, otherwise the block header's timestamp.
      iter checks `log.block_timestamp.is_none()` before fetching the header
      (:404), build_fetcher checks `log.block_timestamp.is_some()` to skip the
      prefetch (:603), and log_to_evm_event writes `log.block_timestamp.unwrap_or(0)`
      (:522). The prefetch exists only to warm the cache for iter, so its skip
      condition and iter's fetch condition must agree, and nothing links them.
    fix: >-
      One private `async fn log_timestamp(provider, store, log: &Log) -> Result<Timestamp, HistoryError>`
      next to ensure_block_header_via returns `log.block_timestamp` when it is
      Some and otherwise `ensure_block_header_via(provider, store, block).await?.timestamp`.
      log_to_evm_event takes the resolved timestamp as a parameter
      (`log_to_evm_event(log, timestamp)`), so iter becomes
      `let timestamp = log_timestamp(&provider, &store, &log).await?; let event = log_to_evm_event(&log, timestamp);`
      with no `mut` and no overwrite. The prefetch loop becomes
      `for log in &logs { let _ = log_timestamp(&provider, &store, log).await; }`.
      The rule then has one owner, and its doc is the only place that states it
      (see b2-4). Behaviour: the prefetch would fetch the block-0 header for a log
      without block_number, as iter already does; eth_getLogs returns
      block_number for every mined log, so this is not reachable in practice.
    decision: FIX
    score: 7
    reason: >-
      Full tell of a duplicated rule on changed lines, with two sites that must
      agree (writer of the cache warm-up and its reader). Private code, about 20
      lines of churn.
    same:
      - b2-2
      - b2-3
      - b2-4
