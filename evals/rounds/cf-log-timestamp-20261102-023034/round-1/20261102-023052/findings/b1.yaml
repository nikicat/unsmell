    fix: >-
      Option A, which keeps existing caches and relies on the NULL fallback. The doc says to bump
      only for a change that a migration cannot apply in place, for example a change in what
      existing rows mean. Option B. Bump to 4, which abandons every existing cache file, and update
      the versioned_path test.
    decision: ASK
    score: 6
    reason: >-
      The doc states a rule that the code does not follow. Bumping would change the on-disk
      file name, which users can see, so the choice belongs to the user. The line is unchanged
      but it is the root cause of the question that the changed migration raises.
