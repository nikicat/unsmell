    row: wrong-layer doc
    claim: >-
      The comment that the changeset added on the block_timestamp migration describes
      the query path in history.rs (EvmEvent.timestamp, skipping the eth_getBlockByNumber
      fetch, "the reader falls back to the cached block header") rather than the column.
      The fallback fact is stated again at history.rs:401-402, 520-521 and 601-602, and it is
      inaccurate, because ensure_block_header_via (history.rs:540-555) fetches the header on a
      cache miss. It is also compressed ("Nullable: most providers omit it, …" joins a second idea
      with a colon, and "— in both cases" is a dash clause), it has six lines, and "the reader"
      has no referent in the schema.
    fix: >-
      A comment of two or three plain sentences about the column only. For example, "The
      timestamp of the log's block, in seconds, as the provider sent it with eth_getLogs.
      Not every provider sends it. It is NULL when the provider left it out, and on rows
      written before this migration." The fallback stays documented in history.rs alone.
    decision: FIX
    score: 6
    reason: >-
      The comment states the caller's rule twice and gets it slightly wrong ("cached" header).
      Cause (b) of a long comment, because it describes the caller instead of the column.
    same: []
