    row: misleading name
    claim: >-
      The CACHE_VERSION doc says "Bump this when cache schema or semantics change". But the
      migration that the changeset added at cache.rs:239-249 changes the cached_logs schema and
      leaves the version at 3, and so did the abi_json migration at cache.rs:231-238. Either
