    fix: >
      With b2-1, the fact gets one owner, the doc of log_timestamp:
      "/// Returns the block timestamp of the given log. Uses the timestamp that the provider supplied with the log
      when there is one. Otherwise uses the block header's timestamp, read from the cache or fetched and cached.
      Errors when the header lookup fails." All three `//` comments are deleted.
    decision: FIX
    score: 6
    reason: >
      One fact is written in three copies on changed lines, and one copy is slightly false ("persisted").
      It is fixed in the same patch as b2-1.
