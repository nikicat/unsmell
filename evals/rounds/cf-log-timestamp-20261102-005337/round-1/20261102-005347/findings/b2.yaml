    row: duplicated knowledge
    claim: >
      The changeset added three comments that state one fact, that a log carrying block_timestamp needs no block
      header. history.rs:520-521 describes what the caller does (wrong layer, from above) and joins its ideas with a
      semicolon. history.rs:601-602 joins them with an em-dash, names an unnamed "query path", and says the timestamp
      is read "off the persisted log", although iter can also serve logs from LogIndex's in-memory tree before they
      are drained to LogCache. history.rs:402-403 restates the `if` below it, and "round-trip" is inaccurate because
