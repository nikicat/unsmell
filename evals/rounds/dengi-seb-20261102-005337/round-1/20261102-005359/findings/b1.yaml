  - id: b1-10
    at: [seb.py:41]
    reach: [seb.py:36-42]
    row: unparsed input
    claim: >-
      The ipify response body is used as the Psu-Ip-Address header without a status or
      format check. On a 5xx, its error page becomes the header value: requests then
      raises InvalidHeader on a later API call when the page has inner newlines, or
      the bank gets garbage. A network failure here also kills the run, although the
      header only lifts a rate cap.
    fix: >-
      r = requests.get(…); r.raise_for_status();
      ip = str(ipaddress.ip_address(r.text.strip())), so a bad response fails in
      psu_headers with a clear error. Optionally, return {} with a stderr warning on
      failure, so the run continues as unattended.
    decision: FIX
    score: 7
    reason: >-
      An external body is passed on unvalidated. A bad response today fails later and
      confusingly, or sends a wrong header. This is a small fix at the edge.
    same: []
  - id: b1-11
    at: [seb.py:45-49]
    reach: [seb.py:45-49]
    row: concept mixing
    claim: >-
      call() is the HTTP transport, and it also ends the process with sys.exit on any
      non-2xx. No caller can react. For example, a session that the bank revoked before
      its valid_until gets a 401 and exits, when it could re-authorize.
    fix: >-
      Raise a typed ApiError(status, body) from call(). main catches it and exits with
      the same message. Re-authorizing on 401 is a separate feature.
    decision: SKIP
    score: 4
    reason: >-
      Exiting is acceptable for a single-command script. A typed error with no caller
      that handles it is a feature (§5), not a smell fix.
    same: []
