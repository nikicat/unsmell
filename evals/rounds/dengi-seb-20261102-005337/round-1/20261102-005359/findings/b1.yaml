  - id: b1-6
    at: [seb.py:62-66]
    reach: [seb.py:52-68]
    row: unparsed input
    claim: >-
      The redirect URL pasted at the prompt (seb.py:63) is read by key and position.
      If the user cancels or the bank refuses, the redirect carries error= and no code,
      so q["code"][0] raises a KeyError traceback. The state check and the code
      extraction are inline in authorize. authorize therefore mixes the API protocol,
      terminal I/O, input parsing and a file write.
    fix: >-
      A module-level code_from_redirect(url: str, state: str) -> str. It exits with
      "bad redirect: …" when the state does not match, and with the bank's
      error/error_description when there is no code. It returns q["code"][0] otherwise.
      authorize() then reads as its steps: start the authorization, prompt, take the
      code from the redirect, open the session, save it (Session.save, b1-4).
    decision: FIX
    score: 6
    reason: >-
      Edge input accessed by key, with an unhandled KeyError on a plain user action
      (cancel). Behaviour: a clear message replaces the traceback.
    same: [b1-1, b1-4]
  - id: b1-7
    at: [seb.py:97, schema.sql:2]
    reach: [seb.py:97, schema.sql:2, schema.sql:22, schema.sql:25]
    row: algebraic blindness
    claim: >-
      The iban variable and the txn.iban column hold an IBAN, or the account's Enable
      Banking uid when the bank sends no IBAN (seb.py:97). As far as I know, Enable
      Banking issues account uids per session; this should be checked against its API
      docs. If so, every 180-day re-authorization files the same account under a new
      key. Resume (seb.py:99-100) then starts from all history, and every transaction
      is stored a second time under the new key, because the primary key is
      (iban, entry_reference).
    fix: >-
      Option A: require an IBAN and exit with a message for an account without one.
      Option B: key the ledger by a stable account identifier (the account's
      identification_hash, or account_id.other.identification) in a column named for
      what it holds, such as account. Account.ledger_key (b1-4) owns the choice. I
      would pick A for an SEB LT personal account, which always has an IBAN.
    decision: ASK
    score: 6
    reason: >-
      Two kinds of value in one name and column, with a likely duplication bug on
      re-authorization. The fix changes the stored schema or the CLI behaviour, and
      two designs are defensible.
    same: [b1-4]
  - id: b1-8
