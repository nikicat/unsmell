    row: missing receiver
    claim: >-
      headers(), call(), authorize() and transactions() all share one Enable Banking
      client context (API, KEY, APP_ID, PSU) that reaches them as module globals, not
      parameters. PSU (seb.py:24) is an empty dict that main() rebinds via `global PSU`
      (seb.py:92-93) before the first call; headers() silently sends no PSU headers if
      anything calls it earlier, and the comment "# set in main()" states the coupling
      instead of removing it.
    fix: >-
      class EnableBanking with fields app_id, key, psu (built once in main as
      EnableBanking(config, psu_headers())), and methods _headers() (the JWT + PSU merge),
      call(method, path, **kw), authorize(), session() and transactions(uid, start).
      The PSU global, the `global PSU` statement and the "# set in main()" comment are
      deleted; API stays a module constant.
    decision: FIX
    score: 7
    reason: >-
      Full tell: one context used by every API function, with a mutable global set by
      main (temporal coupling). Behaviour-preserving, mechanical.
    same: [b1-2, b1-4, b1-5, b1-6]
  - id: b1-2
