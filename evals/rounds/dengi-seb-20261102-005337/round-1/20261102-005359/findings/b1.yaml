    claim: >-
      main() puts its steps (PSU headers, session, fetch, store, report) between
      inline blocks of other work. It connects to sqlite and loads the schema (:94-95).
      It derives the account key (:97). It decides the resume date with a SQL query and
      positional .fetchone()[0] (:99-100). It filters BOOK (:101). It counts rows with a
      lambda before and after the upsert (:102-103, :109). It writes the upsert SQL
      (:105-108). The same "SELECT … FROM txn WHERE iban = ?" … fetchone()[0] shape
      is written twice.
    fix: >-
      class Ledger(db: sqlite3.Connection) with open(path) -> Ledger (connect plus
      executescript of schema.sql), last_booking_date(iban) -> date | None, and
      store(iban, txs) -> int. store does the BOOK filter with its reason (b1-15), the
      upsert and the row count, and returns the number of new rows. main reads: parse
      args, build the client, open the ledger, then for each account fetch, store and
      print one summary line.
    decision: FIX
    score: 7
    reason: >-
      Steps and SQL details are interleaved in one function, with a repeated
      query/unwrap shape. Behaviour-preserving.
    same: [b1-3, b1-15, b1-16]
