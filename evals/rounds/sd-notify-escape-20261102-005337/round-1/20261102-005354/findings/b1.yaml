findings:
  - id: b1-1
    at: [internal/notification/desktop.go:591-673]
    reach: [internal/notification/desktop.go:582-678, internal/notification/slow_upstream.go:79-111]
    row: primitive obsession
    claim: >-
      The changeset fixed markup injection in formatBody by wrapping each of about twelve interpolated
      values in esc() (desktop.go:601, 612, 620, 626, 628, 638, 653, 655, 657, 663), while the raw <b>/<i>
      tags are written by hand into the same strings.Builder. "Escaped" is an invariant that no type carries,
      so the next field added to the body can be interpolated raw and nothing fails; the sibling formatter
      formatSlowUpstreamBody already does exactly that (b1-2).
    fix: >-
      A small package-private markup writer in internal/notification (for example `type markup struct{ b strings.Builder }`
      with `text(s)`, `bold(s)`, `italic(s)` that escape their argument and `String()`), so raw tags exist only inside
      it. formatBody and formatSlowUpstreamBody build through it; no esc alias and no hand-written tag remain.
    decision: ASK
    score: 6
    reason: >-
      The "escaped" tell is met in full (7-8), minus 2 for churn: it rewrites the whole ~95-line formatBody and the
      slow-upstream formatter. Two shapes are defensible (a writer type vs. keeping html.EscapeString at each call
      with named helpers from b1-3/b1-4), so ask.
    same: []
  - id: b1-2
    at: [internal/notification/slow_upstream.go:86-106]
    reach: [internal/notification/slow_upstream.go:79-111, internal/notification/slow_upstream_test.go]
    row: unparsed input
    claim: >-
      formatSlowUpstreamBody writes item labels or paths (slow_upstream.go:87, 92) and process comm names (:105)
      unescaped into a body that goes through the same org.freedesktop.Notifications Notify call (NotifyPersistent).
      This is the same markup injection that the changeset fixed in formatBody; the fix covered only one of the
      package's two body formatters.
    fix: >-
      Escape every client-controlled value in formatSlowUpstreamBody with the same mechanism formatBody uses
      (html.EscapeString, or the markup writer if b1-1 is accepted), plus a slow_upstream_test.go case with a
      hostile label and comm name.
    decision: FIX
    score: 9
    reason: >-
      A bug of the class the changeset fixes; the root cause (no single escaping owner) extends outside the batch (§6).
      The slow-upstream notification has no action buttons, so impact is lower, but injected markup still renders.
    same: []
  - id: b1-3
    at: [internal/notification/desktop.go:636-648, internal/notification/desktop.go:661-673]
    reach: [internal/notification/desktop.go:632-675]
    row: duplication
    claim: >-
      The default branch renders the request subject twice, once per sub-format: the same case list
      (GetSecret, Delete, Write / Search), the same "label or N items" and "search attrs or all" rules, differing only
      in <b> vs <i>. The changeset had to add esc() to both copies (desktop.go:638 and :663, :644 and :669), which is the
      "two sites you edit together" tell.
    fix: >-
      One helper `requestSubject(req *approval.Request) string` that returns the escaped subject text (the item
      label, "N items", the search attrs, "all", or "" for other types). The chain format wraps it in <b>…</b> and the
      fallback format in <i>…</i>, each only when non-empty.
    decision: FIX
    score: 7
    reason: Duplicated rule, tell met in full; behaviour-preserving; about 20 lines.
    same: []
  - id: b1-4
    at: [internal/notification/desktop.go:593-615]
    reach: [internal/notification/desktop.go:582-678]
    row: mixed altitude
    claim: >-
      The changeset opens formatBody with 30 lines of helper definitions (an alias and two closures) before its
      switch, so the function reads as setup detail before its decision. writeChain is always called with
      req.SenderInfo.ProcessChain (desktop.go:621, 631, 649), so its parameter adds nothing; escapedSearchAttrs captures
      only req.SearchAttributes. Neither needs to be a closure. Both closure comments open with their own names.
    fix: >-
      Lift both to package-level functions next to commitSubject: `writeProcessChain(b *strings.Builder, chain
      []approval.ProcessInfo, showPIDs bool)` and `formatSearchAttrs(attrs map[string]string) string`, each with a
      one-line doc that starts with its verb ("Appends…", "Returns…"). If b1-1 is accepted they take the markup writer
      instead of *strings.Builder; if b1-3 is fixed, formatSearchAttrs is called from requestSubject.
    decision: FIX
    score: 6
    reason: Mixed altitude added by the diff (role pass item 3); mechanical; the closures' doc openings fixed in the same move.
    same: []
  - id: b1-5
    at: [internal/notification/desktop.go:585-591]
    reach: [internal/notification/desktop.go:581-592]
    row: long comment
    claim: >-
      A 6-line comment sits on `esc := html.EscapeString`, a local that only renames a standard function. Cause (b),
      wrong subject: it carries formatBody's contract and its threat model, and its field list
      "(repo/commit/label/search attrs, and process comm …)" omits req.Client, InvokerName and the SSH destination,
      which the code also escapes, so it already states less than the code. It also joins two ideas with a semicolon
      and uses "must" phrasing. formatBody itself has no doc.
    fix: >-
      Delete the alias and call html.EscapeString directly (or the b1-1 writer). Put the contract on formatBody as a
      plain doc, for example: "Returns the notification body for req, in the markup that notification servers render.
      All client-controlled text is escaped, because the notification carries approve and deny buttons and injected
      markup could make a request look trustworthy." Drop the field list and the prctl aside (InvokerName's spoofability
      is owned by approval/types.go:44).
    decision: FIX
    score: 6
    reason: The comment states less than the code (incomplete enumeration) and the contract lives on the wrong item; residue alias removed with it.
    same: [b1-6]
