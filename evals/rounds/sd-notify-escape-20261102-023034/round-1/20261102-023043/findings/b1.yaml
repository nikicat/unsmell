    at: [internal/notification/desktop.go:583-673]
    reach: [internal/notification/desktop.go:582-678, internal/notification/slow_upstream.go:80-111]
    row: primitive obsession
    claim: >-
      The body handed to Notifier.Notify is FreeDesktop markup whose invariant is
      "client text escaped", but it is a raw strings.Builder plus a string. The
      changeset added the rule as a local alias esc := html.EscapeString at
      desktop.go:591 and wrapped it by hand around 12 interpolation sites
      (desktop.go:601, 612, 620, 626, 628, 638, 653, 655, 657, 663). Nothing makes a
      new site escape, and the sibling body formatter formatSlowUpstreamBody
      (slow_upstream.go:80-111) already writes labels, paths and process names
      into the same kind of body unescaped.
    fix: >-
      One unexported markup builder in package notification (e.g. type bodyMarkup
      struct wrapping strings.Builder) whose methods text(s), bold(s), italic(s)
      escape their argument and write the tags, plus a processChain(chain, showPIDs)
      method replacing the writeChain closure; formatBody and formatSlowUpstreamBody
      both build their body with it, the esc alias and its comment go away (the
      rule's why moves to a two-line doc on the type). Notifier.Notify keeps its
      string parameter (changing the exported interface would be an ASK).
    decision: FIX
    score: 7
    reason: >-
      Full tell of primitive obsession (a value with an "escaped" invariant the type
      does not carry) and the rule is misplaced on a local alias. The fix is
      behaviour-preserving for formatBody; for slow_upstream it is the bug fix of
      b1-2. Churn is about 40 lines, but the second caller already exists, so the
      type earns itself.
    same: [b1-2, b1-5, b1-6]
