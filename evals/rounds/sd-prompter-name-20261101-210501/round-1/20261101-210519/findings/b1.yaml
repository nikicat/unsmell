    fix: >-
      Use about three plain sentences, for example: "Returns a bridge that owns
      org.gnome.keyring.SystemPrompter on the backend bus and forwards its prompts to the
      session prompter on the front bus. Returns nil when the backend bus already has a
      prompter, as in remote or same-bus mode. Errors when the name request or the export
      on the backend bus fails." If b1-2 is not taken, add "If another process already owns
      the name, the bridge forwards nothing." The rationale stays only on the type doc.
    decision: FIX
    score: 7
    reason: >-
      These are changed lines. The fix states a missing outcome and the errors, and removes a
      copied fact and history. Its wording on the fallback waits on b1-3.
    same: [b1-5, b1-10, b1-3]
