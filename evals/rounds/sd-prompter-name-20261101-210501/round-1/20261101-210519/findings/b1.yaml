  - id: b1-1
    at: [internal/proxy/prompter.go:56-57, internal/proxy/prompter.go:99, internal/proxy/prompter.go:103-107, internal/proxy/prompter.go:122, internal/proxy/prompter.go:183]
    reach: [internal/proxy/prompter.go:53-58, internal/proxy/prompter.go:96-125, internal/proxy/prompter.go:181-183]
    row: oversized lock
    claim: >-
      The closed flag, the active idempotency guard and the mutex taken in activate only
      served the race between the removed awaitFrontPrompter goroutine and close(). activate
      now has one caller (newPrompterBridge:90), which runs it once on a bridge nobody else
      can see yet, so closed is never true and active never true when :105 reads them. The
      closed write in close() is dead, and so is the "Idempotent, and a no-op after close()" contract.
    fix: >-
      Delete the closed and active fields, the :105-107 guard, `b.active = true` and
      `b.closed = true`. Drop the Lock/Unlock in activate, because the bridge is not shared
      yet. mu stays and guards callbacks (and owned until b1-2). Drop "Idempotent, and a
      no-op after close()" from the activate doc (b1-6 rewrites the rest).
    decision: FIX
    score: 6
    reason: >-
      Dead code that the change left behind. Its lines are mostly unchanged, but the changed
      lines (the removed watch goroutine and the removed guard at :87-91) are what made them
      dead, so this is the change's own residue, not an older smell.
    same: [b1-2, b1-6]
  - id: b1-2
    at: [internal/proxy/prompter.go:55, internal/proxy/prompter.go:112-116, internal/proxy/prompter.go:188-193]
    reach: [internal/proxy/prompter.go:53-58, internal/proxy/prompter.go:60-125, internal/proxy/prompter.go:181-194]
    row: algebraic blindness
    claim: >-
      Before the change, a non-nil bridge that was not active stood for "waiting for the front
      prompter". Now the only such state is "lost the claim to another owner" (:112-114).
      newPrompterBridge then returns a non-nil bridge that owns nothing and exports nothing,
      and the owned flag exists only so that close() can tell that case apart. This is
      the same no-bridge outcome as the same-bus case at :76-79, but spelled as a
      third state.
    fix: >-
      Final shape: newPrompterBridge returns (nil, nil) when the backend bus already has a
      prompter, and also when RequestName does not make it the primary owner (it logs that
      case). A returned bridge therefore always owns the name and has exported the object.
      owned, active and closed go away. close() unexports the callbacks under mu and then
      releases the name unconditionally. activate either folds into newPrompterBridge or
      reports the lost claim to it (via a sentinel error or a named result), so the caller
      can return nil.
    decision: ASK
    score: 5
    reason: >-
      There are two defensible shapes (fold activate in, or keep it with a named outcome).
      The change is internal and p.prompter is nil-checked in Proxy.Close, so no caller
      outside the package notices.
    same: [b1-1]
  - id: b1-3
