    row: long comment
    claim: >-
      The newPrompterBridge doc runs 15 lines, and its cause is (b), the wrong subject. It
      opens with its own name. It tells history against the removed design ("it does NOT
      wait for gnome-shell's front prompter"). It repeats the fallback rationale (F1, owned by
